<div class="header" [ngStyle]="{'font-size': textSize + 'px'}">
  <ng-container *ngFor="let titre of titres; let i = index">
    <ng-container *ngIf="titre.lien; else noLink">
      <a [href]="titre.lien">{{ titre.text }}</a>
    </ng-container>
    <ng-template #noLink>
      <span>{{ titre.text }}</span>
    </ng-template>

    <span *ngIf="i < ((titres?.length ?? 0) - 1)"> > </span>
  </ng-container>
  <div class="splitter"></div>
</div>
