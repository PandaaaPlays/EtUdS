<etuds-navbar
  [isCollapsed]="isCollapsed"
  (isCollapsedChange)="toggleCollapse($event)"
  *ngIf="!isConnectionPage">
</etuds-navbar>

<router-outlet></router-outlet>

<div *ngIf="loading$ | async" class="loading">
  <div class="spinner"></div>
</div>
<div class="body"
     [ngClass]="{
     'with-navbar': !isConnectionPage && !isCollapsed,
     'with-collapsed-navbar': !isConnectionPage && isCollapsed,
     'without-navbar': isConnectionPage}"
>
  <router-outlet></router-outlet>
</div>

<chat *ngIf="!isConnectionPage"></chat>
