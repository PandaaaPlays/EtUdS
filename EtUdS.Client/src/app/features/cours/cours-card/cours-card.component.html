<a href="/cours/{{ id }}" class="cours-card-link">
<div class="cours-card">
  <div class="outter-layer">
    <div class="background">
      <div class="inner-layer">
        <p class="code-cours"> {{ sigle }} </p>
        <p class="titre-cours" [title]="titre"> {{ titre }} </p>
        <p class="prof-cours"> {{ prenomProf }} {{ nomProf }} </p>
      </div>
    </div>
  </div>
</div>
</a>
