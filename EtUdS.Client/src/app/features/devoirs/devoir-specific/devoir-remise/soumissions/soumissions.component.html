<div class="soumissions">
  <header [textSize]="20"
          [titres]="[{ text: 'Soumissions', lien: '' }]">
  </header>
  <div class="body">
    <div class="liens">
      <div *ngIf="soumissions.length === 0" class="no-soumission">
        Aucune soumission disponible.
      </div>
      <div class="soumission" *ngFor="let soumission of soumissions">
        <span [title]="soumission.nomFichier">{{soumission.nomFichier}}</span>
        <div class="fin">
          <span class="date">{{formatDate(soumission.tempsSoumission, true)}}</span>
          <span class="size">{{soumission.taille}}KB</span>
          <i title="Télécharger" class="fa-solid fa-download download" (click)="downloadFile(soumission.id)"></i>
          <i title="Supprimer"
             class="fa-solid fa-rectangle-xmark x"
             (click)="deleteFile(soumission.id)"></i>
        </div>
      </div>
    </div>
    <div class="deposer-soumission">
      <drag-box
        [action]="ajouterFichiers.bind(this)">
      </drag-box>
    </div>
    <div class="boutons-soumission">
      <button-etuds [texte]="'Annuler'" [couleur]="'rouge'" class="annuler" (click)="annuler()"></button-etuds>
      <button-etuds [texte]="'Soumettre' + (nbFichier > 0 ? ' (' + nbFichier + ')' : '')"  [couleur]="'vert'" (click)="soumettre()"></button-etuds>
    </div>
  </div>
</div>
