<div class="documents">
  <header class="header-documents" [textSize]="20"
          [titres]="[{ text: 'Documents', lien: '' }]">
  </header>
  <div class="body">
    <div class="liens">
      <div *ngIf="fichiers.length === 0" class="no-documents">
        Aucun document disponible.
      </div>
      <div class="document" *ngFor="let fichier of fichiers">
        <span [title]="fichier.nomFichier + ' | ' + fichier.prenom + ' ' + fichier.nom">{{ fichier.nomFichier }}</span>
        <span [title]="fichier.taille" class="size">{{ fichier.taille }}KB</span>
        <i title="Télécharger" class="fa-solid fa-download download" (click)="downloadFile(fichier.id)"></i>
        <i *ngIf="currentEtudiantId === fichier.idEtudiant"
           title="Supprimer"
           class="fa-solid fa-rectangle-xmark x"
           (click)="deleteFile(fichier.id)"></i>
        <div *ngIf="currentEtudiantId !== fichier.idEtudiant" class="disabled"></div>
      </div>
    </div>
    <drag-box
      [action]="uploadFiles.bind(this)">
    </drag-box>
  </div>
</div>
