<div class="membre" *ngIf="!vide; else videTemplate">
  <i *ngIf="!etudiant.accepte" class="fa-regular fa-user user" title="Invité"></i>
  <i *ngIf="etudiant.accepte" class="fa-solid fa-user user" title="Membre"></i>
  <span class="nom">{{ etudiant.prenom }} {{ etudiant.nom }}</span>
  <span class="courriel">{{ etudiant.courriel }}</span>
  <i *ngIf="kickable" class="fa-solid fa-rectangle-xmark x" title="Exclure" (click)="kick()"></i>
</div>

<ng-template #videTemplate>
  <div class="membre">
    <i class="fa-solid fa-clipboard-question question" title="Disponible"></i>
    <span class="disponible">Place disponible...</span>
  </div>
</ng-template>
